seed: 42

data:
  # Leave null for portability; pass --data_root on Kaggle.
  root: null
  image_size: 512
  val_ratio: 0.15

training:
  batch_size: 4
  num_workers: 2
  epochs: 30
  learning_rate: 0.001
  weight_decay: 0.0001
  patience: 7

model:
  features: [32, 64, 128, 256]

output:
  dir: outputs
